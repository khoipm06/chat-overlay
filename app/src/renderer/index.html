<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Overlay</title>
    <link rel="stylesheet" href="./codicon.css" />
    <link rel="stylesheet" href="./katex.min.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app-shell">
      <!-- Top Title Bar -->
      <header class="title-bar">
        <div class="title-bar-left">
          <span class="title-label">CHAT</span>
          <div id="live-status-pill" class="live-status-pill hidden">
            <i id="live-status-icon" class="codicon codicon-loading codicon-modifier-spin"></i>
            <span id="live-status-text">Ready</span>
            <span id="live-status-timer" class="live-status-timer"></span>
          </div>
        </div>
        <div class="title-bar-actions">
          <button id="btn-undo-chat" class="icon-btn" title="Undo Revert (Ctrl+Shift+Z)" disabled>
            <i class="codicon codicon-arrow-left"></i>
          </button>
          <button id="btn-redo-chat" class="icon-btn" title="Redo Revert (Ctrl+Shift+Y)" disabled>
            <i class="codicon codicon-arrow-right"></i>
          </button>
          <button id="btn-new-chat" class="icon-btn" title="New Conversation (Ctrl+N)">
            <i class="codicon codicon-add"></i>
          </button>
          <button id="btn-history" class="icon-btn" title="Conversation History">
            <i class="codicon codicon-history"></i>
          </button>
          <button id="btn-settings" class="icon-btn" title="Settings">
            <i class="codicon codicon-settings-gear"></i>
          </button>
          <button id="btn-app-menu" class="icon-btn" title="Menu & Actions">
            <i class="codicon codicon-menu"></i>
          </button>
          <button id="btn-close" class="icon-btn" title="Hide Overlay (Esc / Hotkey)">
            <i class="codicon codicon-close"></i>
          </button>
        </div>
      </header>

      <!-- Workspace & Harness Subheader -->
      <div class="sub-header">
        <div class="sub-header-left">
          <button id="btn-workspace" class="chip-btn" title="Workspace Folder (Click to change workspace)">
            <i class="codicon codicon-folder"></i>
            <span id="workspace-name">workspace</span>
          </button>
        </div>
        <button id="btn-harness" class="chip-btn" title="Switch ACP Harness">
          <span id="harness-dot" class="harness-dot"></span>
          <span id="harness-label">Antigravity</span>
          <i class="codicon codicon-chevron-down"></i>
        </button>
      </div>

      <!-- Compact Operational Strip: Revert Mode, Git Branch Glance, Ghost Mode, Context Budget -->
      <div class="glance-strip">
        <div class="glance-left">
          <button id="btn-revert-mode" class="revert-mode-pill" title="Revert Mode">
            <i class="codicon codicon-discard"></i>
            <span id="revert-mode-label">Files+Chat</span>
          </button>
          <button id="git-branch-chip" class="git-branch-chip hidden" title="Git branch & uncommitted changes">
            <i class="codicon codicon-git-branch"></i>
            <span id="git-branch-text"></span>
          </button>
          <span id="ghost-mode-badge" class="ghost-mode-badge hidden" title="Click-through enabled (Ctrl+Alt+G)">
            Ghost
          </span>
          <span id="session-title-chip" class="session-title-chip" title="Conversation title">New chat</span>
        </div>
        <div id="context-budget" class="context-budget hidden" title="Context window usage">
          <span id="context-budget-text">0k</span>
          <div class="context-budget-track">
            <div id="context-budget-fill" class="context-budget-fill"></div>
          </div>
        </div>
      </div>

      <!-- Animated Progress Ribbon -->
      <div id="progress-ribbon" class="progress-ribbon hidden">
        <div class="progress-ribbon-bar"></div>
      </div>

      <!-- Transient Revert / Action Toast -->
      <div id="notice-toast" class="notice-toast hidden"></div>

      <!-- Error / Status Notice Banner -->
      <div id="harness-banner" class="harness-banner hidden">
        <i class="codicon codicon-warning"></i>
        <div class="harness-banner-body">
          <div id="harness-banner-title" class="harness-banner-title"></div>
          <div id="harness-banner-detail" class="harness-banner-detail"></div>
        </div>
        <button id="btn-retry-warmup" class="mini-action-btn">Retry</button>
      </div>

      <!-- Main Chat Viewport -->
      <main id="chat-viewport" class="chat-viewport">
        <!-- Welcome State -->
        <section id="welcome-view" class="welcome-view">
          <div class="welcome-hero">
            <div class="welcome-emblem">
              <i class="codicon codicon-terminal"></i>
            </div>
            <h1 class="welcome-title">Build with agent</h1>
            <p class="welcome-subtitle">
              Screen-aware ACP coding sidebar. Mention <code>@file</code>, <code>@screen</code>,
              or press <code>Ctrl+.</code> to pick a model.
            </p>
            <div class="starter-prompts">
              <button class="starter-card" data-prompt="@screen What am I looking at? Suggest next steps.">
                <i class="codicon codicon-device-camera"></i>
                <span>Inspect live screen with <code>@screen</code></span>
              </button>
              <button class="starter-card" data-prompt="Summarize this workspace architecture and entry points.">
                <i class="codicon codicon-folder-library"></i>
                <span>Explore current workspace files</span>
              </button>
              <button class="starter-card" data-prompt="/review ">
                <i class="codicon codicon-code"></i>
                <span>Review code or recent changes</span>
              </button>
            </div>
          </div>
        </section>

        <!-- Messages List -->
        <section id="messages-view" class="messages-view hidden"></section>

        <button id="btn-scroll-bottom" class="scroll-bottom-btn hidden" title="Scroll to bottom">
          <i class="codicon codicon-arrow-down"></i>
        </button>
      </main>

      <!-- Floating Autocomplete / Popovers Container -->
      <div id="popover-layer"></div>

      <!-- Queued Follow-Up Card -->
      <div id="queued-banner" class="queued-banner hidden">
        <div class="queued-top">
          <span class="queued-badge"><i class="codicon codicon-clock"></i> Queued</span>
          <span id="queued-preview" class="queued-preview"></span>
        </div>
        <div class="queued-actions">
          <button id="btn-queued-steer" type="button" class="mini-action-btn">Steer Now</button>
          <button id="btn-queued-edit" type="button" class="mini-action-btn">Edit</button>
          <button id="btn-queued-cancel" type="button" class="mini-action-btn">Cancel</button>
        </div>
      </div>

      <!-- Clipboard Companion Quick Actions -->
      <div id="clipboard-actions-bar" class="clipboard-actions-bar hidden">
        <span class="clipboard-actions-label"><i class="codicon codicon-clippy"></i> Clipboard</span>
        <button type="button" class="mini-action-btn" data-clip-action="Explain">Explain</button>
        <button type="button" class="mini-action-btn" data-clip-action="Summarize">Summarize</button>
        <button type="button" class="mini-action-btn" data-clip-action="Translate">Translate</button>
        <button type="button" class="mini-action-btn" data-clip-action="Fix">Fix</button>
        <button id="btn-clip-close" type="button" class="icon-btn" title="Dismiss">
          <i class="codicon codicon-close"></i>
        </button>
      </div>

      <!-- Unified Composer Card -->
      <footer class="composer-wrap">
        <div id="composer-card" class="composer-card">
          <div class="composer-top-row">
            <button id="btn-add-context" class="add-context-btn" title="Attach file, clipboard, or screen">
              <i class="codicon codicon-add"></i>
              <span>Context</span>
            </button>
            <div id="attachments-row" class="attachments-row"></div>
          </div>

          <textarea
            id="composer-input"
            class="composer-input composer-textarea"
            rows="1"
            placeholder="Ask anything, @ to mention, / for commands"
          ></textarea>

          <div class="composer-bottom-row">
            <div class="composer-pickers">
              <button id="btn-mode-picker" class="picker-btn" title="Agent mode">
                <span id="mode-label">Default</span>
                <i class="codicon codicon-chevron-down"></i>
              </button>

              <button id="btn-model-picker" class="picker-btn" title="Select Model (Ctrl+.)">
                <i id="model-loading-spinner" class="codicon codicon-loading codicon-modifier-spin hidden"></i>
                <span id="model-label">Loading...</span>
                <i class="codicon codicon-chevron-down"></i>
              </button>

              <button id="btn-effort-picker" class="picker-btn hidden" title="Thinking / Reasoning Effort">
                <i class="codicon codicon-sparkle"></i>
                <span id="effort-label">Medium</span>
                <i class="codicon codicon-chevron-down"></i>
              </button>
            </div>

            <div class="composer-actions">
              <button id="btn-clipboard-companion" class="icon-btn" title="Grab Clipboard / Selection (Ctrl+Alt+Q)">
                <i class="codicon codicon-clippy"></i>
              </button>
              <button id="btn-pin-screen" class="icon-btn" title="Pin live @screen on every prompt">
                <i class="codicon codicon-eye"></i>
              </button>
              <button id="btn-clear-markup" class="icon-btn hidden" title="Clear screen annotations">
                <i class="codicon codicon-clear-all"></i>
              </button>
              <button id="btn-mic" class="icon-btn mic-btn" title="Voice Input (Speech-to-Text)">
                <i id="mic-icon" class="codicon codicon-mic"></i>
              </button>
              <button id="btn-send" class="send-btn" title="Send (Enter)">
                <i id="send-icon" class="codicon codicon-arrow-up"></i>
              </button>
            </div>
          </div>
        </div>
      </footer>

      <!-- Drag & Drop Overlay -->
      <div id="drop-overlay" class="drop-overlay hidden">
        <div class="drop-overlay-card">
          <i class="codicon codicon-cloud-upload"></i>
          <div>Drop files, images, or links to attach</div>
        </div>
      </div>

      <!-- Full-Overlay Slide-in Drawer (Settings / History / Diffs) -->
      <div id="modal-backdrop" class="modal-backdrop hidden">
        <div id="modal-panel" class="modal-panel">
          <div class="modal-header">
            <h2 id="modal-title">Settings</h2>
            <button id="btn-modal-close" class="icon-btn" title="Close (Esc)">
              <i class="codicon codicon-close"></i>
            </button>
          </div>
          <div id="modal-body" class="modal-body"></div>
        </div>
      </div>

      <!-- Native Context Preview & Lightbox Modal (Modern Web Guidance: <dialog>, closedby="any", 2D panning) -->
      <dialog id="context-preview-dialog" class="context-preview-dialog" closedby="any" aria-labelledby="preview-dialog-title">
        <div class="preview-dialog-shell">
          <div class="preview-dialog-header">
            <div class="preview-dialog-title-wrap">
              <i id="preview-dialog-icon" class="codicon codicon-file"></i>
              <span id="preview-dialog-title" class="preview-dialog-title">Context Preview</span>
              <span id="preview-dialog-badge" class="preview-dialog-badge"></span>
            </div>
            <div class="preview-dialog-actions">
              <button id="btn-preview-zoom" type="button" class="mini-action-btn hidden" title="Toggle 2.5x Zoom &amp; Pan (Click image or Z)">
                <i class="codicon codicon-zoom-in"></i>
                <span id="preview-zoom-label">Zoom 2.5x</span>
              </button>
              <button id="btn-preview-copy" type="button" class="mini-action-btn" title="Copy content to clipboard">
                <i class="codicon codicon-copy"></i>
                <span id="preview-copy-label">Copy</span>
              </button>
              <button id="btn-preview-close" type="button" class="icon-btn" title="Close (Esc)">
                <i class="codicon codicon-close"></i>
              </button>
            </div>
          </div>
          <div id="preview-dialog-body" class="preview-dialog-body"></div>
        </div>
      </dialog>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
