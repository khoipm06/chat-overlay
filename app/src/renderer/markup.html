<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screen Markup</title>
    <link rel="stylesheet" href="./codicon.css" />
    <link rel="stylesheet" href="./markup.css" />
  </head>
  <body>
    <canvas id="markup-canvas"></canvas>

    <!-- User Annotate Toolbar -->
    <div id="annotate-toolbar" class="toolbar hidden">
      <button class="tool-btn active" data-tool="box" title="Box (1)">
        <i class="codicon codicon-symbol-structure"></i><span>Box</span>
      </button>
      <button class="tool-btn" data-tool="arrow" title="Arrow (2)">
        <i class="codicon codicon-arrow-right"></i><span>Arrow</span>
      </button>
      <button class="tool-btn" data-tool="pen" title="Freehand Pen (3)">
        <i class="codicon codicon-edit"></i><span>Pen</span>
      </button>
      <button class="tool-btn" data-tool="highlighter" title="Highlighter (4)">
        <i class="codicon codicon-paintcan"></i><span>Highlight</span>
      </button>
      <button class="tool-btn" data-tool="badge" title="Step Number Badge (5)">
        <i class="codicon codicon-circle-filled"></i><span>Step</span>
      </button>
      <div class="sep"></div>
      <div id="color-palette" class="color-palette">
        <button type="button" class="color-swatch active" data-color="#ef4444" style="--c:#ef4444;" title="Red"></button>
        <button type="button" class="color-swatch" data-color="#0ea5e9" style="--c:#0ea5e9;" title="Sky Blue"></button>
        <button type="button" class="color-swatch" data-color="#10b981" style="--c:#10b981;" title="Emerald"></button>
        <button type="button" class="color-swatch" data-color="#f59e0b" style="--c:#f59e0b;" title="Amber"></button>
        <button type="button" class="color-swatch" data-color="#a855f7" style="--c:#a855f7;" title="Purple"></button>
      </div>
      <div class="sep"></div>
      <button id="btn-undo" class="tool-btn" title="Undo (Ctrl+Z)">
        <i class="codicon codicon-discard"></i><span>Undo</span>
      </button>
      <button id="btn-clear-all" class="tool-btn" title="Clear">
        <i class="codicon codicon-trash"></i><span>Clear</span>
      </button>
      <div class="sep"></div>
      <button id="btn-cancel-markup" class="tool-btn">Cancel (Esc)</button>
      <button id="btn-submit-markup" class="tool-btn primary">Attach Markup (Enter)</button>
    </div>

    <!-- Region Crop Prompt Pill -->
    <div id="region-toolbar" class="toolbar hidden">
      <i class="codicon codicon-crop"></i>
      <span class="badge" id="region-hint">Drag to select area · Esc to cancel</span>
      <button id="btn-cancel-region" class="tool-btn">Cancel</button>
    </div>

    <!-- Agent Highlight Dismiss Pill -->
    <div id="agent-toolbar" class="toolbar hidden">
      <span id="agent-markup-count" class="badge">Highlights active</span>
      <button id="btn-dismiss-agent-markup" class="tool-btn primary">Clear Screen Markup</button>
    </div>

    <script type="module" src="./markup-app.js"></script>
  </body>
</html>
