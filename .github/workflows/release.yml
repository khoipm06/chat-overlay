name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-rust:
    name: Build Rust Legacy (linux-x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgraphene-1.0-dev \
            meson \
            ninja-build \
            wayland-protocols \
            libwayland-dev

      - name: Build and install gtk4-layer-shell
        run: |
          git clone --depth 1 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          meson setup /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell --prefix=/usr -Dintrospection=false -Dvapi=false
          sudo ninja -C /tmp/gtk4-layer-shell/build install
          sudo ldconfig

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package tarball
        run: tar -czvf pi-overlay-linux-x86_64.tar.gz -C target/release pi-overlay

      - name: Upload Rust artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-rust
          path: pi-overlay-linux-x86_64.tar.gz

  build-electron:
    name: Package Electron (Linux / Windows / macOS)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build bundle
        run: |
          rm -rf dist
          npm run build

      - name: Stage and package cross-platform builds
        run: |
          rm -rf /tmp/co-stage /tmp/co-out /tmp/co-archives
          mkdir -p /tmp/co-stage /tmp/co-out /tmp/co-archives
          cp -r dist /tmp/co-stage/dist
          find /tmp/co-stage/dist -name '*.map' -delete
          node -e "const p=require('./package.json'); require('fs').writeFileSync('/tmp/co-stage/package.json', JSON.stringify({name:p.name,version:p.version,description:p.description,main:p.main,license:p.license},null,2))"
          ELECTRON_VER="$(node -p "require('./node_modules/electron/package.json').version")"
          bunx @electron/packager /tmp/co-stage chat-overlay --platform=linux --arch=x64 --out=/tmp/co-out --overwrite --electron-version="$ELECTRON_VER"
          bunx @electron/packager /tmp/co-stage chat-overlay --platform=win32 --arch=x64 --out=/tmp/co-out --overwrite --electron-version="$ELECTRON_VER"
          bunx @electron/packager /tmp/co-stage chat-overlay --platform=darwin --arch=arm64,x64 --out=/tmp/co-out --overwrite --electron-version="$ELECTRON_VER"
          tar -C /tmp/co-out -czf /tmp/co-archives/chat-overlay-linux-x64.tar.gz chat-overlay-linux-x64
          (cd /tmp/co-out && zip -qr /tmp/co-archives/chat-overlay-win32-x64.zip chat-overlay-win32-x64)
          (cd /tmp/co-out && zip -qr /tmp/co-archives/chat-overlay-darwin-arm64.zip chat-overlay-darwin-arm64)
          (cd /tmp/co-out && zip -qr /tmp/co-archives/chat-overlay-darwin-x64.zip chat-overlay-darwin-x64)

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-electron
          path: /tmp/co-archives/*

  publish:
    name: Create GitHub Release
    needs: [build-rust, build-electron]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
