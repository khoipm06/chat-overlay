name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-electron:
    name: Package Electron (Linux / Windows / macOS)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build bundle
        run: npm run build:prod

      - name: Stage and package cross-platform builds
        run: |
          rm -rf /tmp/co-stage /tmp/co-out /tmp/co-archives
          mkdir -p /tmp/co-stage /tmp/co-out /tmp/co-archives
          cp -r dist /tmp/co-stage/dist
          cp -r resources /tmp/co-stage/resources
          node -e "const p=require('./package.json'); require('fs').writeFileSync('/tmp/co-stage/package.json', JSON.stringify({name:p.name,version:p.version,description:p.description,main:p.main,license:p.license},null,2))"
          ELECTRON_VER="$(node -p "require('./node_modules/electron/package.json').version")"
          bunx @electron/packager /tmp/co-stage chat-overlay --platform=linux --arch=x64 --out=/tmp/co-out --overwrite --electron-version="$ELECTRON_VER"
          bunx @electron/packager /tmp/co-stage chat-overlay --platform=win32 --arch=x64 --out=/tmp/co-out --overwrite --electron-version="$ELECTRON_VER"
          bunx @electron/packager /tmp/co-stage chat-overlay --platform=darwin --arch=arm64,x64 --out=/tmp/co-out --overwrite --electron-version="$ELECTRON_VER"
          tar -C /tmp/co-out -czf /tmp/co-archives/chat-overlay-linux-x64.tar.gz chat-overlay-linux-x64
          (cd /tmp/co-out && zip -qr /tmp/co-archives/chat-overlay-win32-x64.zip chat-overlay-win32-x64)
          (cd /tmp/co-out && zip -qr /tmp/co-archives/chat-overlay-darwin-arm64.zip chat-overlay-darwin-arm64)
          (cd /tmp/co-out && zip -qr /tmp/co-archives/chat-overlay-darwin-x64.zip chat-overlay-darwin-x64)

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-electron
          path: /tmp/co-archives/*

  publish:
    name: Create GitHub Release
    needs: [build-electron]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
