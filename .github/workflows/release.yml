name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-whisper-server:
    name: Build optional whisper-server (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
            cmake_flags: "-DGGML_NATIVE=OFF"
            artifact: whisper-server-linux-x64.tar.gz
          - target: win32-x64
            os: windows-latest
            cmake_flags: "-DGGML_NATIVE=OFF"
            artifact: whisper-server-win32-x64.zip
          - target: darwin-arm64
            os: macos-latest
            cmake_flags: "-DGGML_NATIVE=OFF -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON"
            artifact: whisper-server-darwin-arm64.tar.gz
          - target: darwin-x64
            os: macos-latest
            cmake_flags: "-DGGML_NATIVE=OFF -DCMAKE_OSX_ARCHITECTURES=x86_64 -DGGML_METAL=OFF"
            artifact: whisper-server-darwin-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential curl

      - name: Download & configure whisper.cpp v1.9.6
        shell: bash
        run: |
          curl -fsSL https://github.com/ggml-org/whisper.cpp/archive/refs/tags/v1.9.6.tar.gz -o whisper.tar.gz
          tar -xzf whisper.tar.gz
          cmake -S whisper.cpp-1.9.6 -B build \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_SERVER=ON \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DWHISPER_BUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.cmake_flags }}

      - name: Compile whisper-server
        shell: bash
        run: cmake --build build --target whisper-server --config Release -j 4

      - name: Archive standalone whisper-server binary
        shell: bash
        run: |
          mkdir -p out-bin out-archive
          BIN_PATH="$(find build -type f \( -name 'whisper-server' -o -name 'whisper-server.exe' \) | head -n 1)"
          cp "$BIN_PATH" out-bin/
          if [[ "${{ matrix.target }}" == "win32-x64" ]]; then
            7z a -tzip "out-archive/${{ matrix.artifact }}" ./out-bin/*
          else
            tar -C out-bin -czf "out-archive/${{ matrix.artifact }}" .
          fi

      - name: Upload optional whisper-server archive
        uses: actions/upload-artifact@v4
        with:
          name: whisper-${{ matrix.target }}
          path: out-archive/${{ matrix.artifact }}

  package-app:
    name: Package Installer (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            platform: linux
          - name: Windows
            os: windows-latest
            platform: win32
          - name: macOS
            os: macos-latest
            platform: darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux packaging tools (rpmbuild)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm desktop-file-utils

      - name: Install app dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Package Linux AppImage / deb / rpm
        if: matrix.platform == 'linux'
        working-directory: app
        run: npm run dist:linux

      - name: Package Windows NSIS installer
        if: matrix.platform == 'win32'
        working-directory: app
        run: npm run dist:win

      - name: Package macOS arm64 & x64 DMG/ZIP
        if: matrix.platform == 'darwin'
        working-directory: app
        run: npm run dist:mac

      - name: Collect release installers
        shell: bash
        run: |
          mkdir -p release-files
          find app/release -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' -o -name 'latest*.yml' \) -exec cp {} release-files/ \;

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: release-files/*

  publish:
    name: Create GitHub Release
    needs: [build-whisper-server, package-app]
    runs-on: ubuntu-24.04
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: all-artifacts/*
